# Beamline-profile CI — service stand-ins as ONE compose file.
#
#   Redis   -> 127.0.0.1:6379 (plaintext, legacy profiles) and :6380 (TLS, nslsii redis_ssl=True)
#   MongoDB -> 127.0.0.1:27017 (databroker backend)
#   Kafka   -> 127.0.0.1:9092  (bluesky documents; single-node KRaft, no ZooKeeper)
#   Tiled   -> 127.0.0.1:8000  (catalog, --temp; Caddy on :443 fronts it as tiled.nsls2.bnl.gov)
#
# Adapted from the simulated HEX beamline's compose (NSLS2/hex-ob, hex-simulated-beamline/compose),
# which was itself adapted from this harness's CI steps — one definition, runnable in CI *and* on a
# laptop:  `docker compose -f services/docker-compose.yml up -d --wait`  (certs: see services/certs.sh).
#
# Host ports can be moved for a laptop that already runs one of these:
#   REDIS_PLAIN_PORT=16379 docker compose -f services/docker-compose.yml up -d --wait
#
# Differences from the sim on purpose: Redis keeps the plaintext 6379 (several profiles still use it);
# the Tiled API key comes from TILED_SERVER_API_KEY (default "secret") to match the profiles' env.

name: beamline-ci

services:
  redis:
    image: redis:7
    container_name: beamline-ci-redis
    command:
      - redis-server
      - --port
      - "6379"
      - --tls-port
      - "6380"
      - --tls-cert-file
      - /certs/redis.crt
      - --tls-key-file
      - /certs/redis.key
      - --tls-ca-cert-file
      - /certs/redis.crt
      - --tls-auth-clients
      - "no"
    ports:
      - "127.0.0.1:${REDIS_PLAIN_PORT:-6379}:6379"
      - "127.0.0.1:${REDIS_TLS_PORT:-6380}:6380"
    volumes:
      - ./certs:/certs:ro
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6379", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  mongo:
    image: mongo:4.4
    container_name: beamline-ci-mongo
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    healthcheck:
      test: ["CMD", "mongo", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 3s
      timeout: 5s
      retries: 20

  kafka:
    image: apache/kafka:3.9.0
    container_name: beamline-ci-kafka
    ports:
      - "127.0.0.1:${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 5s
      timeout: 10s
      retries: 30

  tiled:
    image: ghcr.io/bluesky/tiled:latest
    container_name: beamline-ci-tiled
    command: ["tiled", "serve", "catalog", "--temp", "--host", "0.0.0.0", "--port", "8000",
              "--api-key", "${TILED_SERVER_API_KEY:-secret}"]
    ports:
      - "127.0.0.1:${TILED_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz').status==200 else 1)\""]
      interval: 3s
      timeout: 5s
      retries: 30
